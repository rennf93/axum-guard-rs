name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: stable (check, fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Supply-chain tradeoff, deliberate: these pin MOVING branches of the
      # sibling crates, not immutable refs, because neither has a crates.io
      # release yet. The Cargo.toml dependencies are local paths
      # (../tower-guard-rs and, transitively, ../guard-core-rs) with
      # documented TODOs to switch to versioned crates once they are tagged.
      # Once both publish, these checkout steps drop in favor of the registry.
      # TEMPORARY pins: the body-value extraction this adapter documents (and
      # the tower-guard-rs seam that consumes it) live on
      # feat/body-form-scan-binary-islands until the engine merges it and on
      # feat/body-value-extraction until tower-guard-rs merges it. Track
      # master again after those merges (same dance as the previous
      # fix/plain-text-block-responses pin).
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: rennf93/tower-guard-rs
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Checkout guard-core-rs (transitive path dependency)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: rennf93/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place siblings at the path dependency locations
        run: |
          mv tower-checkout ../tower-guard-rs
          mv core-checkout ../guard-core-rs

      - name: Install the stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  msrv:
    name: msrv 1.92 (check, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Moving branches, same tradeoff as the stable job above.
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # TEMPORARY pin: the body-value extraction seam lands with
          # rennf93/tower-guard-rs#13; track master again after that merge.
          repository: rennf93/tower-guard-rs
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Checkout guard-core-rs (transitive path dependency)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # TEMPORARY pin: body-value extraction lands with rennf93/guard-core-rs#22;
          # track master again after that merge.
          repository: rennf93/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place siblings at the path dependency locations
        run: |
          mv tower-checkout ../tower-guard-rs
          mv core-checkout ../guard-core-rs

      - name: Install the MSRV Rust toolchain (1.92)
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.92.0
          rustflags: ""
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test
